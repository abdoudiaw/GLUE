# NERSC Perlmutter: training host, and the host of the coupled surrogate runs (one GPU node:
# B2.5 + EIRENE on the CPU cores, the GLUE service on GPU 0, retrains on GPUs 1-3).
# Jobs are rendered here and submitted from $SCRATCH/GLUE by the NERSC session (MFA login).
name: perlmutter
ssh: perlmutter.nersc.gov
glue_root: /pscratch/sd/d/diawa/GLUE
data_root: /pscratch/sd/d/diawa/eirene_nn
coupling_root: /pscratch/sd/d/diawa/eirene_nn/coupling     # template_chi1/, baserun/, states/, runs/
solps_tree: /pscratch/sd/d/diawa/solps/solps-iter-eirene-training-dump   # fork 9777b64c, B2.5 2fea8974b, host NERSC.gfortran
venv: /pscratch/sd/d/diawa/venvs/solstice
pytorch_module: pytorch/2.13.0
account: m5186
qos: regular
constraint: gpu
mpi_ranks: 64            # EIRENE ranks; B2.5 itself is serial on rank 0
omp_threads: 2           # the service's CPU threads (its model runs on GPU 0; 8 threads slowed EIRENE's 64 ranks by 2 s/step)
exchange_dir: /dev/shm/eirene_surrogate   # request/answer files on node-local storage, never Lustre
# [NERSC session: the lines that make b2run/mpirun work on Perlmutter for this build]
launch_env_bash: |
  export SOLPS_HOST_NAME_FORCE=NERSC
  source setup.ksh gfortran > /dev/null 2>&1   # SETUP/setup.ksh.NERSC.gfortran: cray-hdf5/netcdf, MSCL in lib/NERSC.gfortran
