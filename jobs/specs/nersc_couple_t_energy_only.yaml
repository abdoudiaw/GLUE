# 300-step one-kind test: surrogate electron+ion energy sources only; policy always (no gate) so every step is a surrogate step.
name: t_energy_only
stage: couple
host: perlmutter
params:
  start_state: /pscratch/sd/d/diawa/eirene_nn/coupling/states/b2fstate_step00050
  replay: 3
  dump: 1
  policy: gate
  bundle: /pscratch/sd/d/diawa/eirene_nn/runs/bundles/solstice_sources-f1412eecc875
  service_args: "--gate-kinds sni,smo,see,sei --always --skip-targets 'wneutrals_*,eirbra_sni,eirbra_smo' --keep-strata 6C,7V --keep-momentum-slots 1,2"
  keep_every: 10
  seg_steps: 300
  nseg: 1
  # interactive route (campaigns/nersc/couple_salloc.sh): the driver runs where salloc runs, the service
  # and B2.5 are sibling job steps on the node, the case lives on scratch
  exchange_dir: /pscratch/sd/d/diawa/eirene_nn/coupling/runs/work
  service_prefix: "srun -N 1 -n 1 -c 4 --overlap --gpus-per-node=1"
