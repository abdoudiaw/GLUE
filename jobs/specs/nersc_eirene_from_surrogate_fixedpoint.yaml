# Bistability test: 5000 plain B2.5-EIRENE steps from run 3's final (surrogate fixed-point) state. If EIRENE
# returns toward the reference, the surrogate is biased; if it stays, the plasma has two stable branches.
host: perlmutter
name: eirene_from_surrogate_fixedpoint
params:
  bundle: /pscratch/sd/d/diawa/eirene_nn/runs/bundles/solstice_sources-2942df28b850
  dump: 0
  exchange_dir: /pscratch/sd/d/diawa/eirene_nn/coupling/runs/work
  keep_every: 0
  nseg: 5
  policy: never
  replay: 0
  service_args: --skip-targets 'wneutrals_*'
  service_prefix: srun -N 1 -n 1 -c 4 --overlap --gpus-per-node=1
  start_state: /pscratch/sd/d/diawa/eirene_nn/coupling/runs/gated/states/state_15050
  seg_steps: 1000
stage: couple
