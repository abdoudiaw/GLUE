# Live EIRENE on the drifted plasma: plain EIRENE (two calls per B2.5 step on the same plasma, both dumped) for 10 steps
# from the particle-only test's step-350 state. The model is evaluated offline on the exact inputs of these calls.
name: t_live_350
stage: couple
host: perlmutter
params:
  start_state: /pscratch/sd/d/diawa/eirene_nn/coupling/runs/t_mix_sni/states/state_00350
  replay: 0
  dump: 1
  policy: never
  bundle: /pscratch/sd/d/diawa/eirene_nn/runs/bundles/solstice_sources-f1412eecc875
  service_args: "--device cpu"
  keep_every: 0
  nseg: 1
  seg_steps: 10
  case_template: template_chi1_rep2
  exchange_dir: /pscratch/sd/d/diawa/eirene_nn/coupling/runs/work
  service_prefix: "srun -N 1 -n 1 -c 2 --overlap"   # CPU interactive node (EIRENE every step: the service is never asked)
  service_device: cpu
