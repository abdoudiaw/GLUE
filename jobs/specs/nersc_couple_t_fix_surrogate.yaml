# FIXED CONFIGURATION, surrogate every step, 1000 steps: wall tallies and puff stratum from the model; recombination stratum (7V) and momentum slots 1-2 kept from the last EIRENE call.
name: t_fix_surrogate
stage: couple
host: perlmutter
params:
  start_state: /pscratch/sd/d/diawa/eirene_nn/coupling/states/b2fstate_step00050
  replay: 3
  dump: 1
  policy: always
  bundle: /pscratch/sd/d/diawa/eirene_nn/runs/bundles/solstice_sources-f1412eecc875
  service_args: "--device cpu --keep-strata 7V --keep-momentum-slots 1,2"
  keep_every: 10
  nseg: 1
  seg_steps: 1000
  # interactive route (campaigns/nersc/couple_salloc.sh): the driver runs where salloc runs, the service
  # and B2.5 are sibling job steps on the node, the case lives on scratch
  exchange_dir: /pscratch/sd/d/diawa/eirene_nn/coupling/runs/work
  service_prefix: "srun -N 1 -n 1 -c 32 --overlap"   # CPU interactive node: 16 threads of inference
  service_device: cpu
