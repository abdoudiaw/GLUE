# (eirene_warmup_a 1000 steps, eirene_warmup_b 1000 steps with dumping), 13 more segments to step 15 050.
name: gated_anchor20_warm
stage: couple
host: perlmutter
params:
  start_state: /pscratch/sd/d/diawa/eirene_nn/coupling/runs/eirene_warmup_b/states/state_02050
  replay: 3
  dump: 1
  policy: gate
  bundle: /pscratch/sd/d/diawa/eirene_nn/glue2_work/diiid_eirene_v3/bundles/solstice_sources-41c6d56fe16d
  service_args: --gate-kinds sni,smo,see,sei --skip-targets 'wneutrals_*' --max-consecutive
    20
  keep_every: 10
  retrain_config: /pscratch/sd/d/diawa/GLUE/configs/nersc_coupling_gated_anchor20_warm.yaml
  retrain_interval: 600
  exchange_dir: /pscratch/sd/d/diawa/eirene_nn/coupling/runs/work
  service_prefix: srun -N 1 -n 1 -c 4 --overlap --gpus-per-node=1
  retrain_gpus: 1,2,3
  nseg: 13
  retrain_prefix: srun -N 1 -n 1 -c 8 --overlap --gpus-per-node=4
