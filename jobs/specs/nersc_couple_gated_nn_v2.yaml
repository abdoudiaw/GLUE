# Run 4b: gated surrogate with online retraining from the NN v2 initial state, starting from the bundle
# the gated run (run 3) promoted last. [BUNDLE] is filled in by campaigns/nersc/launch_with_promoted.sh.
name: gated_nn_v2
stage: couple
host: perlmutter
params:
  start_state: /pscratch/sd/d/diawa/eirene_nn/coupling/states/b2fstati.nn_v2
  replay: 3
  dump: 1
  policy: gate
  bundle: "[BUNDLE]"
  service_args: "--gate-kinds sni,smo,see,sei --skip-targets 'wneutrals_*'"
  keep_every: 10
  nseg: 10
  retrain_config: /pscratch/sd/d/diawa/GLUE/configs/nersc_coupling_gated_nn_v2.yaml
  retrain_interval: 600
  retrain_gpus: "0"
  exchange_dir: /pscratch/sd/d/diawa/eirene_nn/coupling/runs/work
  service_prefix: "srun -N 1 -n 1 -c 4 --overlap --gpus-per-node=1"
