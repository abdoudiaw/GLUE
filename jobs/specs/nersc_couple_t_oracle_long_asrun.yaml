# 8000-step oracle test: recorded EIRENE answers with the surrogate runs' settings (wall tallies from the request, C/V strata and momentum slots 1-2 from the last EIRENE call): tests those settings.
name: t_oracle_long_asrun
stage: couple
host: perlmutter
params:
  start_state: /pscratch/sd/d/diawa/eirene_nn/coupling/states/b2fstate_step00050
  replay: 3
  dump: 1
  policy: gate
  bundle: /pscratch/sd/d/diawa/eirene_nn/runs/bundles/solstice_sources-f1412eecc875
  service_args: "--gate-kinds sni,smo,see,sei --always --oracle-events /pscratch/sd/d/diawa/eirene_nn/coupling/oracle_ref/{seg} --skip-targets 'wneutrals_*' --keep-strata 6C,7V --keep-momentum-slots 1,2"
  keep_every: 10
  seg_steps: 1000
  nseg: 8
  # interactive route (campaigns/nersc/couple_salloc.sh): the driver runs where salloc runs, the service
  # and B2.5 are sibling job steps on the node, the case lives on scratch
  exchange_dir: /pscratch/sd/d/diawa/eirene_nn/coupling/runs/work
  service_prefix: "srun -N 1 -n 1 -c 4 --overlap --gpus-per-node=1"
