# Run 3 (gated) as a BATCH job for unattended continuation (same run directory as the interactive chunks:
# the script skips finished segments and the RUNNING guard keeps the two routes from overlapping).
# Case in node-local storage, service as a plain process on GPU 0, retrain loop on GPUs 1-3.
name: gated
stage: couple
host: perlmutter
params:
  start_state: /pscratch/sd/d/diawa/eirene_nn/coupling/states/b2fstate_step00050
  replay: 3
  dump: 1
  policy: gate
  bundle: /pscratch/sd/d/diawa/eirene_nn/runs/bundles/solstice_sources-2942df28b850
  service_args: "--gate-kinds sni,smo,see,sei --skip-targets 'wneutrals_*'"
  keep_every: 10
  retrain_config: /pscratch/sd/d/diawa/GLUE/configs/nersc_coupling_sbatch.yaml
  retrain_interval: 600
  retrain_gpus: "1,2,3"
